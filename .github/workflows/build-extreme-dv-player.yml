name: Build Extreme DV Player APK

on:
  push:
    branches: [ extreme-dv-player ]
    paths:
      - 'extreme-dv-player/**'
      - '.github/workflows/build-extreme-dv-player.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: extreme-dv-player
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp extreme-dv-player/app/build/outputs/apk/debug/app-debug.apk Extreme-DV-Player.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Extreme-DV-Player-APK
          path: Extreme-DV-Player.apk
          retention-days: 30
