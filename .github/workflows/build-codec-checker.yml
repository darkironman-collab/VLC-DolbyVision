name: Build Dolby Vision Codec Checker APK

on:
  push:
    branches: [ codec-checker-apk ]
    paths:
      - 'codec-checker/**'
      - '.github/workflows/build-codec-checker.yml'
  pull_request:
    paths:
      - 'codec-checker/**'
      - '.github/workflows/build-codec-checker.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: codec-checker
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp codec-checker/app/build/outputs/apk/debug/app-debug.apk DolbyVision-Codec-Checker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DolbyVision-Codec-Checker-APK
          path: DolbyVision-Codec-Checker.apk
          retention-days: 30
